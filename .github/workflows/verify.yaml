name: Verify

on:
  push:
    branches: [production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          cache: npm
      - name: Install pinned npm and dependencies
        run: |
          npm install --global npm@11.13.0
          npm ci --fetch-retries=0 --fetch-timeout=30000
      - run: npm run setup
      - run: npm run infra:up
      - run: npm run db:migrate:test
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - name: Stop isolated infrastructure
        if: always()
        run: npm run infra:down
