name: Verify

on:
  push:
    branches: [production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
      - name: Install pinned npm and dependencies
        run: |
          npm install --global npm@11.13.0
          npm ci --fetch-retries=0 --fetch-timeout=30000
      - run: npm run setup
      - run: npm run infra:up
      - run: npm run db:migrate:test
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - name: Stop isolated infrastructure
        if: always()
        run: npm run infra:down
