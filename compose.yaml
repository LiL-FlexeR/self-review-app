x-app: &app
  image: self-review-app:s02
  build: .
  env_file: .env
  environment:
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    DATABASE_URL: postgresql://self_review:local_dev@postgres:5432/self_review
    REDIS_URL: redis://redis:6379/0
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      { POSTGRES_USER: self_review, POSTGRES_PASSWORD: local_dev, POSTGRES_DB: self_review }
    volumes: ['postgres:/var/lib/postgresql']
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U self_review -d self_review'],
        interval: 2s,
        timeout: 3s,
        retries: 30,
      }
  redis:
    image: redis:8.4.8@sha256:319f54e668c14f68cee51d1fdf9dba699deecac048fc0e52962433a3ef5562c0
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: ['redis:/data']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 2s, timeout: 3s, retries: 30 }
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports: ['127.0.0.1:8025:8025']
    healthcheck: { test: ['CMD', '/mailpit', 'readyz'], interval: 2s, timeout: 3s, retries: 30 }
  migrate:
    image: self-review-app:s02
    build: .
    environment: { DATABASE_URL: 'postgresql://self_review:local_dev@postgres:5432/self_review' }
    command: ['npm', 'run', 'migrate', '-w', 'backend']
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *app
    command: ['node', 'backend/dist/main.js']
    ports: ['127.0.0.1:${APP_PORT:-3000}:3000']
    healthcheck:
      {
        test:
          [
            'CMD',
            'node',
            '-e',
            "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
          ],
        interval: 5s,
        timeout: 5s,
        retries: 20,
      }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
  worker:
    <<: *app
    command: ['node', 'backend/dist/worker.js']
    healthcheck:
      {
        test:
          [
            'CMD',
            'node',
            '-e',
            "process.exit(require('node:fs').existsSync('/tmp/self-review-worker-ready')?0:1)",
          ],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
volumes:
  postgres:
  redis:
